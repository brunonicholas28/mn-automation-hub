# Hourly Apollo -> Pipedrive sync.
#
# Vercel's Hobby plan fires crons once a day, and both of its cron slots are
# already taken by apollo-sync and linkedin-score (see vercel.json), so this
# runs on GitHub Actions instead - same pattern as poll-funnel.yml. Contacts
# saved in Apollo now reach Pipedrive within the hour instead of waiting for
# the next 06:00 UTC run.
#
# The Vercel daily cron is left in place as a backstop. Running twice is safe:
# apollo-sync keeps an updated-at cursor and skips any person who already has
# a deal.
#
# Needs a repository secret CRON_SECRET matching the CRON_SECRET environment
# variable on the Vercel project. If CRON_SECRET is unset on Vercel then the
# endpoint accepts unauthenticated calls and the header is simply ignored.
#
# Written in YAML flow style on a single line because GitHub's web editor
# mangles block indentation. This is valid YAML and Actions parses it fine.
#
# GitHub disables scheduled workflows in a repo with no activity for 60 days.
# If sourcing stops reaching Pipedrive, check here first.
{"name": "Sync Apollo to Pipedrive", "on": {"schedule": [{"cron": "37 */6 * * *"}], "workflow_dispatch": null}, "jobs": {"sync": {"runs-on": "ubuntu-latest", "steps": [{"name": "Hit the apollo-sync endpoint", "env": {"CRON_SECRET": "${{ secrets.CRON_SECRET }}"}, "run": "set -euo pipefail\n\n# The endpoint stops itself before Vercel's 60s function ceiling and reports\n# done:false when there is more queue to walk. Call it until it says it is\n# finished rather than assuming one invocation covers the backlog - the first\n# run after the synced-set cache was added has several hundred contacts to\n# back-fill and cannot do it in one go.\nMAX_CALLS=10\nfor i in $(seq 1 $MAX_CALLS); do\n  echo \"--- apollo-sync call $i of $MAX_CALLS ---\"\n  code=$(curl -sS -o response.json -w '%{http_code}' --max-time 120 -H \"Authorization: Bearer ${CRON_SECRET}\" \"https://mn-automation-hub.vercel.app/api/cron/apollo-sync\")\n  cat response.json\n  echo\n  if [ \"$code\" != \"200\" ]; then echo \"apollo-sync failed with HTTP $code\" >&2; exit 1; fi\n\n  done_flag=$(python3 -c \"import json;print(json.load(open('response.json')).get('done'))\")\n  if [ \"$done_flag\" = \"True\" ]; then\n    echo \"apollo-sync caught up after $i call(s).\"\n    exit 0\n  fi\n\n  budget_stopped=$(python3 -c \"import json;print(json.load(open('response.json')).get('pipedrive',{}).get('budgetStopped'))\")\n  if [ \"$budget_stopped\" = \"True\" ]; then\n    echo \"::notice::Stopped on the Pipedrive daily budget guard. Remaining contacts resume on the next scheduled run.\"\n    exit 0\n  fi\n\n  sleep 2\ndone\n\necho \"::notice::Still not caught up after $MAX_CALLS calls. The next scheduled run continues where this left off.\"\n"}]}}}
