# Hourly Anthropic credit / liveness check on the Growth Gap Report pipeline.
#
# Exists because the credit balance ran out twice (17 Aug and 13 Sep 2026) and
# nothing noticed either time. While it is out, every form submission dies at
# the synthesis step: no report for the prospect, and no Pipedrive deal, so the
# lead is lost rather than delayed.
#
# The job endpoint returns 503 when broken, which turns this run red - a free
# second channel alongside the email the job itself sends. The email is the
# one that will actually reach you; this is the backstop for the backstop.
#
# Like the other workflows here it runs on GitHub Actions rather than Vercel
# Cron: the Hobby plan allows two cron jobs per account and apollo-sync and
# linkedin-score already hold both, and Hobby crons only fire once a day.
#
# GitHub disables scheduled workflows in a repository with no activity for 60
# days. If alerts ever go quiet, check here first.

name: Check Anthropic credits

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the Anthropic API through the credit-check job
        env:
          FUNNEL_CRON_KEY: ${{ secrets.FUNNEL_CRON_KEY }}
        run: |
          set -euo pipefail
          response=$(curl -sS -w '\n%{http_code}' --max-time 60 \
            "https://mn-automation-hub.vercel.app/api/cron/run?job=credit-check&key=${FUNNEL_CRON_KEY}")
          body=$(printf '%s' "$response" | sed '$d')
          code=$(printf '%s' "$response" | tail -n1)
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "Anthropic credit check FAILED with HTTP $code - see the body above" >&2
            exit 1
          fi
