# Does a real prospect who completes the Growth Gap Report actually get one?
#
# Exists because of the 15 Sep 2026 outage: Vercel's automatic DDoS mitigation
# began answering Fillout's webhook POSTs with a 403 challenge page, so the
# report app was never reached. credit-check stayed correctly green throughout,
# because the Anthropic balance was fine - it watches one cause, and this was a
# different one. This watches the outcome instead.
#
# Two checks per run, both inside the funnel-watchdog job:
#   A. Reachability - an unauthenticated POST to the report webhook should come
#      back as the app's own 401 JSON, not a firewall's HTML. No credential, no
#      cost, no side effect. Catches breakage before a prospect hits it.
#   B. Pending sweep - any submission api/fillout-hook has seen that is more
#      than 8 minutes old with no finished report. Names the person so they can
#      be recovered by hand.
#
# Every 10 minutes. GitHub's scheduler is best-effort and routinely runs a few
# minutes late under load, so treat detection as "within about 10-25 minutes of
# the submission", not to the second.
#
# The job returns 503 when something is wrong, but this workflow deliberately
# does NOT fail on that - the email alert is the channel. To also get a red
# tick in the Actions tab, change the 503 line in the last step to exit 1.
#
# To prove the alert email arrives without waiting for a real outage, run this
# manually with the "drill" input set. It touches no stored state.
#
# GitHub disables scheduled workflows in a repository with no activity for 60
# days. If alerts ever go quiet, check here first.

name: Funnel watchdog

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      drill:
        description: "Send a test alert email instead of checking. Leave blank for a real check."
        required: false
        default: ""
        type: choice
        options:
          - ""
          - blocked
          - status_api_broken
          - hook_broken
          - pending

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Growth Gap Report funnel end to end
        env:
          FUNNEL_CRON_KEY: ${{ secrets.FUNNEL_CRON_KEY }}
          DRILL: ${{ inputs.drill }}
        run: |
          set -euo pipefail
          url="https://mn-automation-hub.vercel.app/api/cron/run?job=funnel-watchdog&key=${FUNNEL_CRON_KEY}"
          if [ -n "${DRILL:-}" ]; then
            url="${url}&drill=${DRILL}"
            echo "FIRE DRILL: sending a test alert for ${DRILL}. Nothing is actually wrong."
          fi
          response=$(curl -sS -w '\n%{http_code}' --max-time 120 "$url")
          body=$(printf '%s' "$response" | sed '$d')
          code=$(printf '%s' "$response" | tail -n1)
          echo "$body"
          if [ "$code" = "503" ]; then
            echo "Funnel watchdog found a fault - an alert email has been sent. Not failing the run."
          elif [ "$code" != "200" ]; then
            echo "Funnel watchdog could not run: HTTP $code - see the body above" >&2
            exit 1
          fi
