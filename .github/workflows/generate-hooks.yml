# Researches the Day 2 hook for every lead in the cohort.
#
# Runs Friday morning, after Thursday's mint, which leaves the whole weekend
# before Monday's campaign build and Tuesday's send. If a run fails there are
# three days to notice and re-run it by hand.
#
# The endpoint researches a handful of leads per call and reports how many are
# left, so this loops until it reports none. Looping here rather than inside
# the function is deliberate: a serverless function has a sixty second ceiling
# and a cohort does not fit in it, but a GitHub Actions job has hours.
#
# Nothing sends. Hooks land on the lead record; the campaign they feed is
# created paused on Monday and Marina presses Launch.
#
# 12 Sep 2026: the first live run researched all 265 leads and returned 3
# hooks, because the model was answering without searching and the job had no
# way to notice. Two guards were added after it:
#   - reset, so a fixed researcher can actually re-run a cohort. Verdicts are
#     sticky by design, so without this a bad run poisons the cohort forever.
#   - the searches-per-lead check below, which kills a run that is not
#     searching after three passes instead of letting it burn the whole cohort.

name: generate-hooks

on:
  schedule:
    - cron: "0 7 * * 5"
  workflow_dispatch:
    inputs:
      cohort:
        description: "Cohort id, e.g. c20260915. Leave blank for the next Tuesday."
        required: false
        default: ""
      batch:
        description: "Leads researched per call, 1 to 8"
        required: false
        default: "3"
      live:
        description: "Set to 1 to actually research. This spends Anthropic credits."
        required: false
        default: "0"
      reset:
        description: "Set to 1 to clear every verdict in the cohort FIRST, then research it again."
        required: false
        default: "0"
      debug:
        description: "Set to 1 to research one batch and print the raw model replies without writing anything."
        required: false
        default: "0"

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Research hooks until the cohort is done
        env:
          FUNNEL_CRON_KEY: ${{ secrets.FUNNEL_CRON_KEY }}
          COHORT: ${{ github.event.inputs.cohort || '' }}
          BATCH: ${{ github.event.inputs.batch || '3' }}
          LIVE: ${{ github.event.inputs.live || (github.event_name == 'schedule' && '1') || '0' }}
          RESET: ${{ github.event.inputs.reset || '0' }}
          DEBUG: ${{ github.event.inputs.debug || '0' }}
        run: |
          BASE="https://mn-automation-hub.vercel.app/api/cron/run?job=generate-hooks"

          # A verdict is sticky: a lead that has one is never picked up again.
          # So re-running a fixed researcher over a cohort that a broken run
          # already marked does nothing at all unless the verdicts go first.
          if [ "${RESET}" = "1" ]; then
            echo "Clearing existing verdicts for ${COHORT:-next tuesday}"
            curl -sS --fail-with-body \
              "${BASE}&key=${FUNNEL_CRON_KEY}&cohort=${COHORT}&reset=1&live=${LIVE}" \
              -o reset.json
            cat reset.json
            echo
          fi

          # One batch, raw model replies, nothing written. This is the cheap
          # way to see whether the model is searching before spending a cohort.
          if [ "${DEBUG}" = "1" ]; then
            curl -sS --fail-with-body \
              "${BASE}&key=${FUNNEL_CRON_KEY}&cohort=${COHORT}&batch=${BATCH}&debug=1" \
              -o response.json
            if grep -qiE '"email"|@[a-z0-9.-]+\.[a-z]{2,}' response.json; then
              echo "Refusing to print: response contains personal data"
              exit 1
            fi
            cat response.json
            echo
            exit 0
          fi

          # Hard ceiling on iterations. A bug that stopped decrementing the
          # remaining count would otherwise loop until the job times out,
          # spending real money on every pass. Three leads a pass over a 265
          # lead cohort is about 90 passes, so this leaves real headroom.
          TOTAL_SEARCHES=0
          TOTAL_LEADS=0
          DEAD=0
          STUCK=0
          PREV_REMAINING=-1

          for i in $(seq 1 250); do
            curl -sS --fail-with-body \
              "${BASE}&key=${FUNNEL_CRON_KEY}&cohort=${COHORT}&batch=${BATCH}&live=${LIVE}" \
              -o response.json

            # The response carries no names or emails, only counts, but this
            # repository is public and so are these logs. Fail rather than
            # print a person if that ever stops being true.
            if grep -qiE '"email"|@[a-z0-9.-]+\.[a-z]{2,}' response.json; then
              echo "Refusing to print: response contains personal data"
              exit 1
            fi

            cat response.json
            echo

            grep -q '"ok":true' response.json

            REMAINING=$(python3 -c "import json;print(json.load(open('response.json')).get('remaining',0))")
            PASS_SEARCHES=$(python3 -c "import json;print(json.load(open('response.json')).get('searchesUsed',0))")
            PASS_LEADS=$(python3 -c "import json;print(json.load(open('response.json')).get('researched',0))")
            TOTAL_SEARCHES=$((TOTAL_SEARCHES + PASS_SEARCHES))
            TOTAL_LEADS=$((TOTAL_LEADS + PASS_LEADS))
            echo "Pass ${i}: ${REMAINING} left, ${PASS_SEARCHES} searches this pass"

            # Two ways a run goes bad, and both used to be silent.
            #
            # The first produced 3 hooks from 265 leads on 12 Sep: the job ran
            # clean, reported no errors, and every lead came back NO-TRIGGER in
            # under four seconds because the model never searched.
            #
            # The second showed up on the very next run: the Anthropic account
            # ran out of credit eleven leads in, so every call 400'd. Errors
            # leave the lead unmarked on purpose, which is right, but it means
            # remaining never falls and the loop happily spent two hundred
            # passes asking for the same three leads.
            #
            # So the check is on CONSECUTIVE dead passes, not on the run total.
            # A cumulative check is no use: once the early passes have searched,
            # every pass after them sails through.
            if [ "${PASS_SEARCHES}" -eq 0 ]; then
              DEAD=$((DEAD + 1))
            else
              DEAD=0
            fi

            if [ "${LIVE}" = "1" ] && [ "${DEAD}" -ge 4 ]; then
              echo "STOPPING: ${DEAD} passes in a row ran zero web searches."
              echo "Either the model is answering from memory, or the API is refusing the calls."
              echo "The last response is above: check errorSample first, then re-run with debug=1."
              exit 1
            fi

            # Nothing settled and nothing left to settle means the loop cannot
            # make progress, whatever the reason. Stop rather than grind.
            if [ "${REMAINING}" -eq "${PREV_REMAINING}" ]; then
              STUCK=$((STUCK + 1))
            else
              STUCK=0
            fi
            PREV_REMAINING=${REMAINING}

            if [ "${LIVE}" = "1" ] && [ "${STUCK}" -ge 6 ]; then
              echo "STOPPING: remaining has sat at ${REMAINING} for ${STUCK} passes."
              echo "The run is not making progress. Read the last response above before re-running."
              exit 1
            fi

            if [ "${REMAINING}" -eq 0 ]; then
              echo "Cohort fully researched."
              break
            fi

            # A dry run never decrements anything, so one pass is the whole
            # story and looping would just repeat it.
            if [ "${LIVE}" != "1" ]; then
              echo "Dry run, stopping after one pass."
              break
            fi

            sleep 2
          done

          echo "Searches across the run: ${TOTAL_SEARCHES} over ${TOTAL_LEADS} leads"

          python3 - <<'PY'
          import json
          d = json.load(open("response.json"))
          c = d.get("counts", {})
          draft = c.get("DRAFT", 0) or 0
          total = d.get("leadsInCohort", 0) or 0
          summary = {
              "cohort": d.get("cohort"),
              "leads": total,
              "draft": draft,
              "noTrigger": c.get("NO-TRIGGER"),
              "exclude": c.get("EXCLUDE"),
              "unresearched": c.get("UNRESEARCHED"),
              "remaining": d.get("remaining"),
              "hookRate": round(100.0 * draft / total, 1) if total else 0.0,
          }
          print("FINAL", json.dumps(summary))

          # The target is 60% of the cohort carrying a personalised hook. A run
          # well under that is not necessarily broken - some cohorts are quiet -
          # but it is never something to find out about on send day.
          if total and summary["hookRate"] < 35.0:
              print("")
              print("WARNING: hook rate is %.1f%%, well below the 60%% target." % summary["hookRate"])
              print("Check searches per lead above. Zero or near-zero means the researcher, not the cohort.")
          PY
