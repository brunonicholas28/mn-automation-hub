# 8am UK daily email for the organic LinkedIn push (lib/jobs/organic-digest.js).
# Fires several times each morning (UTC). The job sends from the first run at
# or after 8am UK time and ignores the rest, so it is right in both BST and
# GMT and survives GitHub running a slot late or skipping it.
name: Organic LinkedIn digest
on:
  schedule:
    - cron: "2 7 * * *"
    - cron: "32 7 * * *"
    - cron: "2 8 * * *"
    - cron: "32 8 * * *"
    - cron: "2 9 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Set to 1 to send now regardless of the time"
        required: false
        default: "0"
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Send digest
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ github.event.inputs.force || '0' }}
        run: |
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -H "Authorization: Bearer ${CRON_SECRET}" "https://mn-automation-hub.vercel.app/api/cron/run?job=organic-digest&force=${FORCE}")
          cat /tmp/out.json; echo
          test "$code" = "200"
