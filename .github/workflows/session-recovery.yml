name: Session recovery sweep
on: { schedule: [{ cron: "7 * * * *" }], workflow_dispatch: {} }
jobs: { sweep: { runs-on: ubuntu-latest, steps: [ { name: Call session-recovery, run: "code=$(curl -s -o /tmp/out.json -w '%{http_code}' -H \"Authorization: Bearer ${CRON_SECRET}\" https://mn-automation-hub.vercel.app/api/cron/session-recovery); cat /tmp/out.json; echo; test \"$code\" = \"200\"", env: { CRON_SECRET: "${{ secrets.CRON_SECRET }}" } } ] } }
